<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PilotData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --blue:#38B0E6;--blue2:#3991CE;--yellow:#F2C040;--graymod:#585858;
  --ink:#111827;--text:#595A5A;--muted:#6b7280;--line:#e5e7eb;--soft:#f9fafb;--soft2:#f3f4f6;
  --red:#EF3434;--redtrack:#fde3e3;--green:#16a34a;--greenbg:#ecfdf5;--greenline:#a7f3d0;
  --bg:#ffffff;--sea:#1d4a5c;
  --font:'Syne','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.pdlogo{display:inline-flex;flex-direction:column;line-height:.95;font-weight:600;letter-spacing:.02em;color:#3d3f40;text-align:left}
.pdlogo i{font-style:normal;color:#38B0E6}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- background building ---------- */
.bgcity{position:fixed;right:0;bottom:0;width:min(46vw,640px);height:auto;pointer-events:none;z-index:0;opacity:.9}

/* ---------- HOME ---------- */
#home{position:relative;min-height:100%;display:flex;flex-direction:column;z-index:1;padding-inline:16px}
.topbar{display:flex;align-items:center;gap:36px;padding:12px 60px;border-bottom:1px solid var(--line);margin-inline:-16px;flex-wrap:wrap;background:#fff}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.who b{display:block;font-size:14px;color:var(--ink)}
.who span{font-size:12px;color:var(--text)}
.toplink{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--text);font-size:13px;font-weight:500;padding:0}
.orglogo{position:absolute;right:70px;top:90px;width:64px;height:64px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:60px 90px;position:relative;z-index:2}
.welcome h1{display:flex;align-items:center;gap:22px;margin:0 0 48px;font-weight:700;font-size:clamp(22px,3.2vw,34px);letter-spacing:.28em;color:#4b4c4c;text-wrap:balance;flex-wrap:wrap;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,420px));gap:56px 80px}
.tile{display:flex;gap:22px;align-items:flex-start;background:none;border:0;text-align:left;padding:6px;border-radius:12px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile:hover .pill{filter:brightness(1.05);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.tile p{margin:12px 0 0;color:var(--text);font-size:13px;line-height:1.75}
.pill{display:inline-block;color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;padding:6px 15px;border-radius:999px;text-transform:uppercase}
.p-blue{background:var(--blue)}.p-yellow{background:var(--yellow)}.p-blue2{background:var(--blue2)}.p-gray{background:var(--graymod)}
.homefoot{display:flex;align-items:center;gap:8px;padding:0 0 22px 60px;font-size:17px;font-weight:600;color:#333;position:relative;z-index:2;flex-wrap:wrap}
@media (max-width:760px){.tiles{grid-template-columns:1fr;gap:28px}.topbar{padding:12px 0;gap:18px}.orglogo{display:none}.homefoot{padding-left:0}}

/* ---------- APP SHELL ---------- */
#app{position:relative;height:100%;display:flex;z-index:1}
.side{width:66px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;transition:width .2s;z-index:5;overflow:hidden}
.side.open{width:225px}
.side .tog{height:44px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center}
.side.open .tog{justify-content:space-between;padding:0 14px}
.side .tog .org{display:none;align-items:center;gap:8px;text-align:left}
.side.open .tog .org{display:flex}
.side .tog .org b{font-size:12px;color:var(--ink);display:block}.side .tog .org small{font-size:10px;color:var(--text)}
.nav{display:flex;flex-direction:column;gap:14px;padding:14px 0}
.nav.bottom{margin-top:auto;border-top:1px solid var(--line)}
.navbtn{position:relative;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0 0 0 17px;height:34px;white-space:nowrap}
.navbtn.active::before{content:"";position:absolute;left:10px;top:4px;bottom:4px;width:2px;background:var(--blue);border-radius:2px}
.navbtn.active.y::before{background:var(--yellow)}.navbtn.active.g::before{background:var(--graymod)}
.navbtn .pill{font-size:10.5px;padding:5px 12px;opacity:0;transition:opacity .15s}
.side.open .navbtn .pill{opacity:1}
.navbtn .pill.ghost{background:var(--soft2);color:#333}
.navsec{font-size:9px;color:var(--muted);padding:0 12px;letter-spacing:.05em;display:none}
.side.open .navsec{display:block}
.sidefoot{display:none;font-size:11px;font-weight:600;padding:8px 12px 12px;white-space:nowrap}
.side.open .sidefoot{display:block}
.main{flex:1;min-width:0;padding:14px 26px 14px 22px;overflow:hidden;display:flex}
.panel{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 22px 10px;flex-wrap:wrap}
.phead .ttl{display:flex;align-items:center;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:500;color:#1f2937;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.y{border-color:var(--yellow);color:var(--yellow)}
.btn.y:hover{background:#fffbeb}
.btn svg{width:14px;height:14px}
.pbody{flex:1;min-height:0;overflow:auto;padding:0 22px 18px}
.help{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));border:0;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(57,145,206,.4);z-index:20}
.help svg{width:24px;height:24px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;margin-bottom:12px}
.search input{border:0;outline:0;flex:1;font:inherit;font-size:12px;color:var(--ink);background:none;min-width:0}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.tabs{display:flex;justify-content:center;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs button{border:0;background:none;padding:10px 16px;font-size:12px;font-weight:500;color:#374151;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--c,var(--blue));border-color:var(--c,var(--blue))}
.select{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;font-size:12px;color:#1f2937;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.select::after{content:"";width:6px;height:6px;border-right:1.5px solid #6b7280;border-bottom:1.5px solid #6b7280;transform:rotate(45deg) translateY(-2px)}
label.lab{display:block;font-size:10.5px;color:#4b5563;margin:12px 0 5px}
.card{border:1px solid var(--line);border-radius:10px;background:#fff}
h3.sec{font-size:14px;font-weight:600;margin:0 0 12px;color:var(--ink)}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:5px;z-index:30;min-width:120px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:7px 9px;font-size:12px;border-radius:5px;color:#1f2937;text-align:left}
.menu button.on{background:#eef7fd;color:var(--blue2)}
.menu button:hover{background:var(--soft)}

/* ---------- PATRIMOINE ---------- */
.patri{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;min-height:520px}
.map{position:relative;border-radius:10px;overflow:hidden;background:var(--sea);min-height:520px}
.map svg.fr{position:absolute;inset:0;width:100%;height:100%}
.zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;background:#fff;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.4);overflow:hidden}
.zoom button{width:28px;height:28px;border:0;background:#fff;font-size:17px;border-bottom:1px solid #ccc;color:#333}
.layers svg{width:18px;height:18px}
.layers{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:8px;background:#fff;border:0;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.attrib{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.8);font-size:10px;padding:1px 6px;color:#333}
.marker{cursor:pointer}
.filters{padding:6px 2px}
.filters h4{font-size:12px;font-weight:600;margin:4px 0 8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.filtersfoot{margin-top:40px}
.filtersfoot .btn{width:100%;justify-content:center;padding:9px}
.rlist{border:1px solid var(--line);border-radius:10px;background:var(--soft2);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rlist .info{font-size:10px;color:#333;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
.rlist .info em{color:#c2410c;font-style:normal;margin-left:6px}
.rlist .scroll{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:8px;max-height:560px}
.rcard{background:#fff;border:1px solid transparent;border-radius:8px;padding:10px 10px 8px;text-align:left;width:100%}
.rcard:hover{border-color:#bfe3f6}
.rcard.sel{border-color:var(--blue);background:#eef6fb}
.rcard .top{display:flex;align-items:center;gap:8px}
.code{background:var(--blue);color:#fff;font-size:9.5px;padding:3px 6px;border-radius:3px;font-weight:600}
.rcard .nm{font-size:13.5px;font-weight:600;color:var(--ink);text-transform:uppercase}
.rcard .ad svg,.fiche .addr svg{width:9px;height:9px;vertical-align:-1px}
.rcard .ad{font-size:9.5px;color:#374151;margin-top:5px;line-height:1.5;text-transform:uppercase}
.rcard .nopos{display:inline-block;font-size:9px;color:#b45309;background:#fef3c7;padding:1px 6px;border-radius:9px;margin-top:3px}
.bar{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.bar .tr{flex:1;height:7px;border-radius:4px;background:var(--redtrack);overflow:hidden}
.bar .fl{height:100%;background:var(--red);border-radius:4px}
.bar b{color:var(--red);font-size:11px;font-weight:700;min-width:30px;text-align:right}
.fichewrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
.fiche{padding:4px 6px}
.fiche .fh{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}
.fiche h2 svg{width:18px;height:18px}
.fiche h2{font-size:19px;font-weight:600;margin:6px 0 8px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.fiche .addr{font-size:10.5px;color:#374151;line-height:1.7;text-transform:uppercase}
.photo svg{width:18px;height:18px}
.photo{width:180px;height:112px;border:1.5px dashed #d1d5db;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--muted);align-self:flex-start}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0}
.kvi{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.kvi .ic{width:28px;height:28px;border-radius:50%;background:#eaf5fc;color:var(--blue);display:grid;place-items:center;flex:none}
.kvi .ic svg{width:14px;height:14px}
.kvi small{display:block;font-size:9.5px;color:var(--muted)}
.kvi b{font-size:12px;font-weight:600;text-transform:uppercase}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats3 div{background:#eaf4fb;border-radius:8px;text-align:center;padding:14px 6px}
.stats3 b{display:block;color:var(--blue2);font-size:18px;font-weight:700}
.stats3 small{font-size:10px;color:#374151}
.secth{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;padding:14px 0;border-bottom:1px solid var(--line)}
.secth span{display:flex;align-items:center;gap:6px}
.secth svg{width:14px;height:14px;color:var(--blue)}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.docs button{border:1.5px solid var(--blue);background:#fff;color:var(--blue2);border-radius:8px;padding:11px;font-size:12.5px;font-weight:500;display:flex;gap:8px;align-items:center;justify-content:center}
.docs button:hover{background:#eef7fd}
.docs button.full{grid-column:1/-1}
.docs svg{width:14px;height:14px}
@media (max-width:900px){.patri,.fichewrap{grid-template-columns:1fr}.map{min-height:380px}}

/* ---------- COLLECTES ---------- */
.coll{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px}
.boxed{border:1px solid var(--line);border-radius:12px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.03);min-height:72px;position:relative}
.kpi small{font-size:10px;color:#374151;display:block;max-width:70%;line-height:1.35}
.kpi b{font-size:18px;font-weight:700;display:block;margin-top:10px}
.kpi b.sm{font-size:12px}
.kpi svg{position:absolute;right:10px;top:10px;width:22px;height:22px;color:var(--yellow)}
.clist{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:4px}
.citem{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.citem .t{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;padding:2px 7px;border-radius:5px;background:var(--soft2);color:#374151}
.status.cours{background:#eff6ff;color:#1d4ed8}.status.ann{background:#fef2f2;color:#b91c1c}.status.att{background:#f3f4f6;color:#374151}.status.ok{background:var(--greenbg);color:var(--green)}
.citem .meta{font-size:9.5px;color:#374151;margin-top:6px;display:flex;gap:10px;line-height:1.5}
.rings{display:flex;gap:6px;flex:none;text-align:center}
.ring{width:38px;height:38px}
.rings small{display:block;font-size:8px;color:#374151;margin-top:2px}
.cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .ch h3{margin:0;font-size:14px;font-weight:600}
.seg{display:flex;background:var(--soft2);border-radius:7px;padding:2px}
.seg button{border:0;background:none;font-size:10px;padding:4px 7px;border-radius:5px;color:#374151}
.seg button.on{background:var(--yellow);color:#fff}
.calbox{border:1px solid var(--line);border-radius:10px;padding:10px}
.calnav{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;margin:4px 6px 10px}
.calnav button{border:0;background:none;font-size:14px;color:#374151}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid7>*{min-width:0}
.grid7 .dw{font-size:9.5px;color:#374151;padding:4px 0}
.day{min-height:44px;font-size:9px;color:#374151;padding:2px 1px;border-radius:4px}
.day.today{border:1.5px solid var(--yellow)}
.day.today .dn{color:var(--yellow);font-weight:700}
.ev{display:block;font-size:7px;border-radius:3px;padding:1px 2px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid}
.ev.s{border-color:#22c55e;background:#f0fdf4}.ev.e{border-color:#ef4444;background:#fef2f2}
.legend{display:flex;gap:16px;justify-content:center;font-size:9.5px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:14px;height:9px;border-radius:2px;border:1px solid;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:var(--soft);text-align:left;font-weight:500;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:#1f2937}
.tbl td{padding:7px 8px;border-bottom:1px solid #f1f2f4;white-space:nowrap}
.tbl tr:hover td{background:#fafbfc}
.tbl .x{color:#ef4444}.tbl .d{color:#c4c7cc}
.tblwrap{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:10px}
.pct{display:inline-block;font-size:9.5px;padding:2px 7px;border-radius:9px;background:#fee2e2;color:#dc2626}
.toolbar{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.toolbar small{display:block;font-size:10px;color:#374151;margin-bottom:5px}
.toolbar .btn{width:100%;justify-content:center}
.pager{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#374151;padding:10px 4px;flex-wrap:wrap;gap:8px}
@media (max-width:1000px){.coll{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}}

/* ---------- ANALYSES ---------- */
.ana{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px}
.tools .th{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.06em;color:#374151;padding:8px 0 16px}
.tool{display:flex;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px 12px;background:#fff;text-align:left;width:100%;margin-bottom:8px}
.tool:hover{border-color:var(--blue)}
.tool svg{width:22px;height:22px;color:var(--blue2);flex:none;margin-top:10px}
.tool b{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
.tool small{font-size:10px;color:#374151;line-height:1.55}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px}
.dkpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.dkpis .kpi svg{width:30px;height:30px;top:14px}
.dkpis .kpi{min-height:74px}
.gap-row{height:120px}
@media (max-width:1000px){.ana,.dash{grid-template-columns:1fr}.gap-row{display:none}}

/* ---------- MARKETPLACE ---------- */
.apikey{display:flex;align-items:center;gap:12px;background:var(--soft2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:14px}
.apikey .k{width:28px;height:28px;border-radius:6px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.apikey small{font-size:9.5px;color:#4b5563;display:block}
.apikey code{font-family:"Lucida Console",Monaco,monospace;font-size:11.5px}
.active{margin-left:auto;font-size:10px;color:var(--green);background:var(--greenbg);border:1px solid var(--greenline);border-radius:9px;padding:2px 8px}
.rights{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 10px}
.right{border:1px solid var(--greenline);background:var(--greenbg);border-radius:8px;padding:12px}
.right.no{border-color:var(--line);background:var(--soft)}
.right .rh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:10px}
.right .rh span{font-size:9.5px;font-weight:500;color:var(--green)}
.right.no .rh span{color:#9ca3af}
.right small{font-size:10px;color:#374151}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mstats div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mstats small{font-size:10px;color:#374151;display:block}
.mstats b{font-size:20px;font-weight:700;display:block;margin-top:6px;letter-spacing:.03em}
.mstats em{font-style:normal;font-size:9px;color:#6b7280}
.chart{border:1px solid var(--line);border-radius:10px;padding:14px}
.chart svg{width:100%;height:auto;display:block}
.cons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.conn{border:1px solid var(--line);border-radius:10px;padding:24px 14px;text-align:center;background:#fff}
.conn:hover{box-shadow:0 4px 14px rgba(0,0,0,.06)}
.conn svg{width:26px;height:26px;color:#374151}
.conn b{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.conn small{font-size:10px;color:#374151;line-height:1.55}
.catbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;margin-bottom:12px;align-items:end}
@media (max-width:1000px){.rights,.cons{grid-template-columns:1fr 1fr}.mstats{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:9px 16px;border-radius:8px;font-size:12px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.demo{font-size:10px;color:#6b7280;text-align:center;padding:6px 0 0}
@media (max-width:640px){.main{padding:10px 16px 10px 10px}.side{width:52px}.navbtn{padding-left:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- additions application ---------- */
#login{position:relative;z-index:2;min-height:100%;display:grid;place-items:center;padding-inline:16px}
.logbox{width:min(380px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:0 10px 40px rgba(17,24,39,.08)}
.logbox h1{display:flex;align-items:center;gap:14px;font-size:18px;letter-spacing:.2em;color:#4b4c4c;margin:0 0 6px}
.logbox p{font-size:12px;color:var(--muted);margin:0 0 18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;color:#4b5563}
.field input,.field select,.field textarea{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink);width:100%}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.btnp{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:10px 14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:600;font-size:13px}
.btnp:disabled{opacity:.6;cursor:wait}
.btnp.y{background:var(--yellow)}
.btn.danger{color:#b91c1c;border-color:#fecaca}
.err{font-size:12px;color:#b91c1c;margin:8px 0 0;min-height:16px}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid2 .full{grid-column:1/-1}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
#lmap{position:absolute;inset:0;z-index:1}
.leaflet-container{font-family:var(--font)}
.cluster{background:#3aa0de;color:#fff;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pinI{color:#3aa0de}
.filters select{appearance:none;-webkit-appearance:none;cursor:pointer}
.notes{width:100%;min-height:70px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px;resize:vertical}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:7px}
.photo{padding:0;overflow:hidden;cursor:pointer;background:#fff}
.drawer{position:fixed;left:76px;bottom:20px;width:min(340px,calc(100% - 92px));background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);z-index:40;padding:14px;max-height:60vh;overflow:auto}
.drawer h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}
.notif{padding:9px 0;border-top:1px solid var(--line);font-size:12px}
.notif.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:6px}
.notif small{display:block;color:var(--muted);margin-top:3px}
.badge{position:absolute;left:38px;top:0;background:#ef4444;color:#fff;border-radius:9px;font-size:9px;padding:1px 5px;font-weight:700}
.tbl td.st button{border:0;background:none;padding:0;font:inherit;cursor:pointer}
.chip{display:inline-block;font-size:9.5px;padding:2px 8px;border-radius:9px;font-weight:600}
.chip.present{background:#dbeafe;color:#1d4ed8}.chip.hypothese{background:#fef3c7;color:#a16207}
.tbl input.cf{width:100%;font:inherit;font-size:10px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;margin-top:4px;font-weight:400}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:70;background:rgba(255,255,255,.6)}
.loading div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 26px;font-size:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.citem .ctrl{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.citem select{font:inherit;font-size:10px;border:1px solid var(--line);border-radius:5px;padding:2px 4px}
.linkbtn{border:0;background:none;color:var(--blue2);font-size:10px;padding:0;text-decoration:underline}
</style>
</head>

const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR'):'—';

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function fail(e,ctx){console.error(ctx,e);toast((ctx?ctx+' : ':'')+(e?.message||e))}
function loading(on,txt='Chargement en cours…'){let l=$('#loading');if(on){if(!l){l=document.createElement('div');l.id='loading';l.className='loading';document.body.appendChild(l)}l.innerHTML=`<div>${txt}</div>`}else if(l)l.remove()}

function csv(name,rows,cols){
  const q=v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const txt='﻿'+cols.map(c=>q(c[1])).join(';')+'\n'+rows.map(r=>cols.map(c=>q(typeof c[0]==='function'?c[0](r):r[c[0]])).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast('Export généré : '+name);
}

/* ---------------- données ---------------- */
async function loadAll(){
  loading(true);
  try{
    const [r,c,ct,n,k,a,cn,e]=await Promise.all([
      db.from('residences').select('*').order('code'),
      db.from('collectes').select('*').order('date_debut',{ascending:false}),
      db.from('contrats').select('*'),
      db.from('notifications').select('*').order('created_at',{ascending:false}),
      db.from('api_cle').select('*').limit(1),
      db.from('api_appels').select('*').order('jour'),
      db.from('connecteurs').select('*').order('titre'),
      db.from('v_etat_collecte').select('*').order('nom')
    ]);
    for(const x of [r,c,ct,n,k,a,cn,e]) if(x.error) throw x.error;
    D.res=r.data;D.coll=c.data;D.contrats=ct.data;D.notifs=n.data;D.cle=k.data[0]||null;D.appels=a.data;D.conns=cn.data;D.etat=e.data;
  }catch(err){fail(err,'Lecture de la base');}
  loading(false);
}
async function loadEquip(){
  const E=state.eq;
  let q=db.from('v_equipements').select('*',{count:'exact'}).order('res_code').order('type_ligne',{ascending:false}).order('code_objet');
  if(E.q) q=q.or(`code_objet.ilike.%${E.q}%,libelle.ilike.%${E.q}%,res_code.ilike.%${E.q}%,res_nom.ilike.%${E.q}%`);
  if(E.statut) q=q.eq('statut',E.statut).eq('type_ligne','Équipement');
  const {data,count,error}=await q.range(E.page*E.size,E.page*E.size+E.size-1);
  if(error) return fail(error,'Équipements');
  E.rows=data;E.count=count||0;
}

function modal(title,fieldsHTML,onSave,{saveLabel='Enregistrer',extra=''}={}){
  closeModal();
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='mbg';
  bg.innerHTML=`<form class="modal" id="mform"><h3>${title}</h3>${fieldsHTML}<p class="err" id="merr"></p>
    <div class="mfoot">${extra}<button type="button" class="btn" onclick="closeModal()">Annuler</button><button class="btnp" id="msave">${saveLabel}</button></div></form>`;
  document.body.appendChild(bg);
  bg.addEventListener('mousedown',e=>{if(e.target===bg)closeModal()});
  $('#mform').onsubmit=async e=>{e.preventDefault();$('#msave').disabled=true;
    try{await onSave(new FormData($('#mform')));closeModal()}catch(err){$('#merr').textContent=err.message||err;$('#msave').disabled=false}};
  const f=bg.querySelector('input,select,textarea');if(f)f.focus();
}

function filteredRes(){
  const q=state.q.toLowerCase().trim();
  return D.res.filter(r=>{
    if(q&&!([r.nom,r.code,r.adresse,r.ville,r.code_postal].join(' ').toLowerCase().includes(q)))return false;
    for(const [k,v] of Object.entries(state.f)) if(v&&String(r[k]??'')!==v) return false;
    return true;
  });
}
function filtersHTML(){
  const opts=k=>[...new Set(D.res.map(r=>r[k]).filter(v=>v!==null&&v!==''))].sort((a,b)=>String(a).localeCompare(String(b),'fr'));
  return `<div class="filters"><h4>Filtres</h4>${FILTERS.map(([k,l,all])=>`<label class="lab" for="f_${k}">${l}</label>
    <select class="select" id="f_${k}" onchange="state.f['${k}']=this.value;state.sel=null;render()"><option value="">${all}</option>${opts(k).map(v=>`<option ${state.f[k]===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select>`).join('')}

let map=null;
function mountMap(){
  if(map){map.remove();map=null}
  const el=$('#lmap');if(!el||!window.L)return;
  map=L.map(el,{zoomControl:true}).setView([46.6,2.4],6);
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:19});
  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19});
  sat.addTo(map);L.control.layers({'Satellite':sat,'Plan':osm},null,{position:'topright'}).addTo(map);
  const icon=L.divIcon({className:'pinI',html:'<svg width="26" height="34" viewBox="-13 -34 26 34"><path d="M0 0c-9-12-12-15-12-21a12 12 0 0 1 24 0c0 6-3 9-12 21z" fill="#3aa0de" stroke="#fff" stroke-width="2"/><circle cy="-21" r="4.5" fill="#fff"/></svg>',iconSize:[26,34],iconAnchor:[13,34]});

function calendar(){
  const Y=state.calY,M=state.calM;
  const ev={};const add=(d,t,k)=>{(ev[d]=ev[d]||[]).push([t,k])};
  D.coll.forEach(c=>{
    const s=new Date(c.date_debut+'T00:00:00'),e=new Date(c.date_fin+'T00:00:00');
    if(s.getFullYear()===Y&&s.getMonth()===M)add(s.getDate(),c.titre,'s');
    if(e.getFullYear()===Y&&e.getMonth()===M)add(e.getDate(),c.titre,'e');
  });
  const first=(new Date(Y,M,1).getDay()+6)%7,days=new Date(Y,M+1,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){const l=ev[d]||[];const isT=Y===today.getFullYear()&&M===today.getMonth()&&d===today.getDate();
    const inner=l.length>2?`<span class="ev ${l[0][1]}" title="${esc(l.map(x=>x[0]).join('\n'))}">${l.length} collectes</span>`:l.map(x=>`<span class="ev ${x[1]}" title="${esc(x[0])}">${esc(x[0])}</span>`).join('');
    cells+=`<div class="day ${isT?'today':''}"><span class="dn">${d}</span>${inner}</div>`}
  return `<div class="cal"><div class="ch"><h3>Planification</h3><div class="seg"><button class="on">Mois</button><button onclick="state.calY=${today.getFullYear()};state.calM=${today.getMonth()};render()">Aujourd'hui</button></div></div>
  <div class="calbox"><div class="calnav"><button aria-label="Mois précédent" onclick="calMove(-1)">‹</button>${MOIS[M][0].toUpperCase()+MOIS[M].slice(1)} ${Y}<button aria-label="Mois suivant" onclick="calMove(1)">›</button></div>
  <div class="grid7">${['L','M','M','J','V','S','D'].map(d=>`<div class="dw">${d}</div>`).join('')}${cells}</div>
  <div class="legend"><span><i style="border-color:#22c55e;background:#f0fdf4"></i>Début de collecte</span><span><i style="border-color:#ef4444;background:#fef2f2"></i>Fin de collecte</span></div></div></div>`;
}
function calMove(n){let m=state.calM+n,y=state.calY;if(m<0){m=11;y--}if(m>11){m=0;y++}state.calM=m;state.calY=y;render()}
const ring=(v,label)=>{const r=15,c=2*Math.PI*r;const has=v!==null&&v!==undefined;return `<div><svg class="ring" viewBox="0 0 38 38"><circle cx="19" cy="19" r="${r}" fill="none" stroke="#e5e7eb" stroke-width="3"/>${has&&v>0?`<circle cx="19" cy="19" r="${r}" fill="none" stroke="#F2C040" stroke-width="3" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 19 19)" stroke-linecap="round"/>`:''}<text x="19" y="22" text-anchor="middle" font-size="8.5" font-family="Syne,Arial" fill="#111827">${has?v+'%':'NC'}</text></svg><small>${label}</small></div>`};

      ${tools.map(t=>`<button class="tool" onclick="${t[3]?"state.aView='req';render()":`toast('${t[1].replace(/'/g,"’")} : module à venir')`}">${ic(t[0])}<span><b>${t[1]}</b><small>${t[2]}</small></span></button>`).join('')}</div>
    <div class="boxed"><h3 class="sec" style="font-size:15px">Tableau de bord</h3>
      <div class="dash"><div class="dkpis">
        <div class="kpi" style="cursor:pointer" onclick="toggleNotifs()"><small>NOTIFICATIONS NON LUES</small><b>${unread()}</b><svg style="color:#374151"><use href="#i-bell"/></svg></div>
        <div class="kpi" style="cursor:pointer" onclick="go('collectes')"><small>COLLECTES AU TOTAL</small><b class="num">${D.coll.length}</b><svg><use href="#i-clip"/></svg></div>
        <div class="kpi"><small>RÉSIDENCES</small><b class="num">${D.res.length}</b><svg style="color:var(--blue)"><use href="#i-build"/></svg></div>
        <div class="kpi"><small>COMPLÉTUDE MOYENNE</small><b class="num">${D.res.length?Math.round(D.res.reduce((a,r)=>a+completude(r),0)/D.res.length):0}%</b><svg style="color:var(--blue)"><use href="#i-list"/></svg></div>
        <div class="kpi"><small>CONTRATS ACTIFS</small><b>${actifs.length}</b><svg style="color:var(--blue)"><use href="#i-doc"/></svg></div>
        <div class="kpi"><small>ÉQUIPEMENTS COUVERTS</small><b>${actifs.reduce((a,c)=>a+c.nb_equipements,0)}</b><svg style="color:var(--blue)"><use href="#i-wrench"/></svg></div>
      </div>${calendar()}</div></div>
  </div></div>`;
}

/* =====================================================================
   MARKETPLACE
   ===================================================================== */
function apiChart(){
  const Y=today.getFullYear(),M=today.getMonth(),n=new Date(Y,M+1,0).getDate();
  const byDay={};D.appels.forEach(a=>{const d=new Date(a.jour+'T00:00:00');if(d.getFullYear()===Y&&d.getMonth()===M)byDay[d.getDate()]=a.appels});
  const vals=Array.from({length:n},(_,i)=>byDay[i+1]||0);
  const total=vals.reduce((a,b)=>a+b,0),worked=vals.filter(v=>v>0).length,avg=worked?Math.round(total/worked):0;
  const max=Math.max(...vals,1),peakDay=vals.indexOf(max)+1;
  const W=820,H=230,L=46,B=190,T=24,bw=(W-L-10)/n,y=v=>B-(v/max)*(B-T);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Appels API par jour">`;
  [0,Math.round(max/2),max].forEach(v=>s+=`<text x="${L-10}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#6b7280">${v}</text><line x1="${L}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#f1f2f4"/>`);
  s+=`<line x1="${L}" y1="${B}" x2="${W-10}" y2="${B}" stroke="#e5e7eb"/>`;
  vals.forEach((v,i)=>{const x=L+i*bw+bw*.28;if(v)s+=`<rect x="${x}" y="${y(v)}" width="${bw*.44}" height="${B-y(v)}" rx="2" fill="#38B0E6"><title>${i+1}/${M+1} : ${v} appels</title></rect>`;
    s+=`<text x="${x+bw*.22}" y="${B+16}" text-anchor="middle" font-size="9" fill="#374151">${i+1}</text>`;if(v===max&&max>1)s+=`<text x="${x+bw*.22}" y="${y(v)-6}" text-anchor="middle" font-size="9" fill="#111827" font-weight="600">${v}</text>`});
  if(avg)s+=`<line x1="${L}" y1="${y(avg)}" x2="${W-10}" y2="${y(avg)}" stroke="#F2C040" stroke-dasharray="3 3"/>`;
  s+=`<text x="${(W+L)/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="#374151">Jour</text><text transform="translate(14 ${(B+T)/2}) rotate(-90)" text-anchor="middle" font-size="9" fill="#374151">Nombre d'appels</text></svg>`;
  return {svg:s,avg,total,max:max>1?max:0,peakDay,label:MOIS[M]+' '+Y};
}
function viewMarketplace(){
  const t=state.mTab;
  const tabs=`<div class="tabs" style="--c:#111827">${[['api','API PilotData'],['conn','Connecteurs externes']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="state.mTab='${k}';render()">${l}</button>`).join('')}</div>`;
  let body;
  if(t==='api'){
    const c=apiChart(),k=D.cle;
    const R=k?[['Lecture',k.lecture,'Consulter le patrimoine et les données exposées'],['Mise à jour',k.mise_a_jour,'Modifier les fiches et attributs existants'],['Suppression',k.suppression,'Retirer des éléments du périmètre autorisé'],['Ajout',k.ajout,"Créer de nouveaux éléments via l'API"]]:[];
    body=k?`<div class="apikey"><span class="k"><svg width="14" height="14"><use href="#i-key"/></svg></span><div><small>Clé API rattachée à votre compte</small><code>${esc(k.prefixe)}••••••••••••</code></div><span class="active" style="${k.active?'':'color:#9ca3af;background:#f3f4f6;border-color:#e5e7eb'}">${k.active?'Active':'Inactive'}</span></div>
    <h3 class="sec" style="font-size:12.5px;margin-bottom:0">Droits de la clé</h3>
    <div class="rights">${R.map(r=>`<div class="right ${r[1]?'':'no'}"><div class="rh">${r[0]}<span>${r[1]?'✓ Accordé':'✕ Non accordé'}</span></div><small>${r[2]}</small></div>`).join('')}</div>`:'<div class="empty">Aucune clé API configurée.</div>';
    body+=`<div class="mstats num"><div><small>Appels ce mois</small><b>${c.total.toLocaleString('fr-FR')}</b></div><div><small>Moyenne / jour ouvré</small><b>${c.avg}</b></div><div><small>Pic journalier</small><b>${c.max}</b>${c.max?`<em>le ${c.peakDay}/${today.getMonth()+1}</em>`:''}</div></div>
    <div class="chart"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:6px;flex-wrap:wrap;gap:6px">Consommation — ${c.label}<span style="font-size:10px;font-weight:400;color:#374151"><span style="display:inline-block;width:18px;border-top:2px dashed #F2C040;vertical-align:middle;margin-right:5px"></span>Moyenne (${c.avg})</span></div>${c.svg}</div>`;
  } else {
    const cats=[...new Set(D.conns.map(c=>c.categorie).filter(Boolean))].sort();
    const list=D.conns.filter(c=>!state.cat||c.categorie===state.cat);
    body=`<div class="catbar"><div><label class="lab" for="cat" style="margin-top:0">Catégorie</label><select class="select" id="cat" onchange="state.cat=this.value;render()"><option value="">Toutes les catégories</option>${cats.map(c=>`<option ${state.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><button class="btn" style="justify-content:flex-start;padding:8px 10px" onclick="state.cat='';render()">${ic('i-reset')} Réinitialiser</button></div>
    <div class="cons">${list.map(c=>`<div class="conn"><svg width="26" height="26"><use href="#${esc(c.icone||'i-wifi')}"/></svg><b>${esc(c.titre)}</b><small>${esc(c.description)}</small></div>`).join('')||'<div class="empty">Aucun connecteur.</div>'}</div>`;
  }
  return head('marketplace')+`<div class="pbody">${tabs}${body}</div>`;
}

/* =====================================================================
   ROUTEUR
   ===================================================================== */
const VIEWS={patrimoine:viewPatrimoine,collectes:viewCollectes,analyses:viewAnalyses,marketplace:viewMarketplace};
function go(k){
  if(!VIEWS[k])k='accueil';else state.mod=k;
  if(location.hash!=='#'+k)history.pushState(null,'','#'+k);
  route();
}
async function route(){
  if(!state.user)return renderLogin();
  const k=location.hash.slice(1);
  if(VIEWS[k]){state.mod=k;if(k==='collectes'&&state.cTab==='data'&&!state.eq.rows.length)await loadEquip()}
  render(!VIEWS[k]);
}
function render(home){
  if(!state.user)return renderLogin();
  const isHome=home===true||!VIEWS[location.hash.slice(1)];
  $('#login').hidden=true;$('#home').hidden=!isHome;$('#app').hidden=isHome;
  document.querySelector('.bgcity').style.opacity=isHome?'.95':'.5';
  if(map&&!isHome&&state.mod!=='patrimoine'){map.remove();map=null}
  if(isHome){renderHome();return}
  if(state.mod==='analyses'&&state.aView==='req')window.__req=D.res.filter(r=>REQ_COLS.every(([k])=>{const v=state.cfil[k];return !v||String(r[k]??'').toLowerCase().includes(v.toLowerCase())}));
  $('#app').innerHTML=shell(VIEWS[state.mod]());
  if(state.mod==='analyses'&&state.aView==='req')window.__req=D.res.filter(r=>REQ_COLS.every(([k])=>{const v=state.cfil[k];return !v||String(r[k]??'').toLowerCase().includes(v.toLowerCase())}));
  if(state.mod==='patrimoine'&&!state.sel&&state.pView==='carte')mountMap();
}
function renderKeep(){const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;render();if(id){const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}}
window.addEventListener('popstate',route);

/* ---------------- démarrage ---------------- */
db.auth.onAuthStateChange((event,session)=>{
  // pas d'appel Supabase « awaité » directement dans ce callback (recommandation supabase-js)
  if(event==='PASSWORD_RECOVERY')setTimeout(()=>{openAccount();toast('Choisissez un nouveau mot de passe')},600);
  if(session?.user&&!state.user){state.user=session.user;setTimeout(()=>startSession(session.user),0);return}
  if(session?.user&&state.user){state.user=session.user;return}
  if(!session){
    const was=!!state.user;state.user=null;
    Object.keys(D).forEach(k=>D[k]=Array.isArray(D[k])?[]:null);state.eq.rows=[];
    if(map){map.remove();map=null}closeModal();$('#drawer')?.remove();renderLogin();
  }
});

</script>
